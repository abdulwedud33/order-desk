# Local Supabase stack configuration for Order Desk
project_id = "order-desk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 50            # docs/security.md section 7: page size capped at 50

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30          # per 5 minutes per IP
token_refresh = 150

[functions.track-order]
verify_jwt = false

[functions.ai-parse-order]
verify_jwt = false

[functions.ai-status-draft]
verify_jwt = false

[functions.ai-insights]
verify_jwt = false

